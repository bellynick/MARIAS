<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu Perfil</title>

    <link rel="stylesheet" href="perfil.css">

</head>


<body>

    <main class="pagina">

        <section class="perfil-container">

            <div class="cabecalho">

                <h1>Meu Perfil</h1>

                <p>Personalize seu perfil</p>

            </div>


            <div class="perfil-card">

                <!-- FOTO DE PERFIL -->

                <div class="foto-area">

                    <div class="foto-perfil">

                        <img
                            id="fotoPerfil"
                            src="imagens/avatar1.png"
                            alt="Foto de perfil"
                        >

                    </div>

                    <button
                        class="botao-avatar"
                        onclick="abrirAvatares()"
                    >
                        Escolher avatar
                    </button>

                </div>


                <!-- INFORMAÇÕES -->

                <div class="informacoes">

                    <div class="campo">

                        <label>Nome do usuário</label>

                        <div class="valor">
                            <span id="nomeUsuario">
                                Seu nome
                            </span>
                        </div>

                    </div>


                    <div class="campo">

                        <label>E-mail</label>

                        <div class="valor">
                            <span id="emailUsuario">
                                seuemail@email.com
                            </span>
                        </div>

                    </div>


                    <button
                        class="botao-senha"
                        onclick="alterarSenha()"
                    >
                        🔑 Alterar senha
                    </button>


                    <button
                        class="botao-sair"
                        onclick="sair()"
                    >
                        🚪 Sair
                    </button>

                </div>

            </div>

        </section>


        <!-- JANELA DOS AVATARES -->

        <div
            class="modal"
            id="modalAvatares"
        >

            <div class="modal-conteudo">

                <button
                    class="fechar"
                    onclick="fecharAvatares()"
                >
                    ×
                </button>

                <h2>Escolha seu avatar</h2>

                <p>
                    Escolha uma mulher importante para representar seu perfil.
                </p>


                <div class="avatares">

                    <button
                        class="avatar"
                        onclick="selecionarAvatar('imagens/avatar1.png')"
                    >
                        <img
                            src="imagens/avatar1.png"
                            alt="Avatar 1"
                        >
                    </button>


                    <button
                        class="avatar"
                        onclick="selecionarAvatar('imagens/avatar2.png')"
                    >
                        <img
                            src="imagens/avatar2.png"
                            alt="Avatar 2"
                        >
                    </button>


                    <button
                        class="avatar"
                        onclick="selecionarAvatar('imagens/avatar3.png')"
                    >
                        <img
                            src="imagens/avatar3.png"
                            alt="Avatar 3"
                        >
                    </button>


                    <button
                        class="avatar"
                        onclick="selecionarAvatar('imagens/avatar4.png')"
                    >
                        <img
                            src="imagens/avatar4.png"
                            alt="Avatar 4"
                        >
                    </button>


                    <button
                        class="avatar"
                        onclick="selecionarAvatar('imagens/avatar5.png')"
                    >
                        <img
                            src="imagens/avatar5.png"
                            alt="Avatar 5"
                        >
                    </button>


                    <button
                        class="avatar"
                        onclick="selecionarAvatar('imagens/avatar6.png')"
                    >
                        <img
                            src="imagens/avatar6.png"
                            alt="Avatar 6"
                        >
                    </button>

                </div>

            </div>

        </div>


        <!-- NAVEGAÇÃO -->

        <nav class="barra-navegacao">

            <a
                href="historias.html"
                class="nav-item"
            >
                <span>⌂</span>
                <small>Início</small>
            </a>


            <a
                href="#"
                class="nav-item"
            >
                <span>⌕</span>
                <small>Buscar</small>
            </a>


            <a
                href="#"
                class="botao-central"
            >
                +
            </a>


            <a
                href="#"
                class="nav-item"
            >
                <span>♡</span>
                <small>Favoritos</small>
            </a>

            
           <a
                href="#"
                class="nav-item"
            >

                <span>☰</span>

                <small>Sobre</small>

            </a>


        </nav>

    </main>


    <script src="perfil.js"></script>

</body>

</html>
