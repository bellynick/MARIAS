        <p class="resultado-titulo">SEU RESULTADO</p>

            <span id="inicial"></span>
        </div>

        <h2 id="nomeResultado"></h2>

        <p id="descricaoResultado"></p>

        <button onclick="reiniciarQuiz()">Fazer novamente ↻</button>
